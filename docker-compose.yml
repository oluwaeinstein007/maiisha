services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-maiisha}
      POSTGRES_USER: ${DB_USERNAME:-maiisha}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-maiisha}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-maiisha}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host on purpose (PRD §7.2): only reachable by
    # other containers on this compose network.

  backend:
    image: maiisha-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-maiisha}
      DB_USERNAME: ${DB_USERNAME:-maiisha}
      DB_PASSWORD: ${DB_PASSWORD:-maiisha}
    volumes:
      - backend-storage-public:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy

  queue:
    image: maiisha-queue:latest
    build:
      context: ./backend
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    env_file: ./backend/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-maiisha}
      DB_USERNAME: ${DB_USERNAME:-maiisha}
      DB_PASSWORD: ${DB_PASSWORD:-maiisha}
    volumes:
      - backend-storage-public:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    image: maiisha-scheduler:latest
    build:
      context: ./backend
    restart: unless-stopped
    entrypoint: sh
    command: -c "while true; do php artisan schedule:run; sleep 60; done"
    env_file: ./backend/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-maiisha}
      DB_USERNAME: ${DB_USERNAME:-maiisha}
      DB_PASSWORD: ${DB_PASSWORD:-maiisha}
    volumes:
      - backend-storage-public:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    env_file: ./frontend/.env.local
    environment:
      # Server-side (SSR) fetches run inside this container, where the
      # browser-facing NEXT_PUBLIC_API_URL (localhost:8080) doesn't resolve
      # back to nginx — route those over the compose network instead.
      API_INTERNAL_URL: http://nginx
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - backend-storage-public:/var/www/html/public/storage:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres-data:
  backend-storage-public:
