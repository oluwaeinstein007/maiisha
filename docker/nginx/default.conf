server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    root /var/www/html/public;

    # Publicly served storage (product images) — served directly as static
    # files from the volume shared with the backend container.
    location /storage/ {
        try_files $uri =404;
    }

    # Laravel API + health check + Sanctum's CSRF-cookie endpoint (needed for
    # SPA cookie auth — the frontend hits GET /sanctum/csrf-cookie before any
    # state-changing request) — all proxied to php-fpm.
    location ~ ^/(api|up|sanctum)(/|$) {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;

        # NFR-1: fastcgi_params doesn't forward these the way proxy_pass does
        # below — without them Laravel's trustProxies() (bootstrap/app.php) has
        # no X-Forwarded-Proto to read, so it can never tell a request arrived
        # over HTTPS once a TLS-terminating proxy sits in front of this one.
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
    }

    # Everything else goes to the Next.js storefront/admin.
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
