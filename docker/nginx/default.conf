server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    root /var/www/html/public;

    # Publicly served storage (product images) — served directly as static
    # files from the volume shared with the backend container.
    location /storage/ {
        try_files $uri =404;
    }

    # Laravel API + health check — proxied to php-fpm.
    location ~ ^/(api|up)(/|$) {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # Everything else goes to the Next.js storefront/admin.
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
